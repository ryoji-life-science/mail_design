<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>財務経営資料</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ナビゲーション -->
<nav class="nav">
  <span class="nav-title">📊 財務経営資料</span>
  <div class="nav-tabs">
    <button class="nav-tab active" data-page="quarterly">四半期予実</button>
    <button class="nav-tab" data-page="half-year">上半期予実</button>
    <button class="nav-tab" data-page="annual">通期見通し</button>
    <button class="nav-tab" data-page="chart">通期グラフ</button>
    <button class="nav-tab" data-page="mgmt">管理会計</button>
    <button class="nav-tab" data-page="financial">財務諸表</button>
  </div>
  <div class="nav-actions">
    <button class="btn-download" onclick="downloadExcel('management')">📥 経営資料Excel</button>
    <button class="btn-download" onclick="downloadExcel('financial')">📥 財務諸表Excel</button>
  </div>
</nav>

<div class="content">

  <!-- ===== 四半期予実 ===== -->
  <div id="page-quarterly" class="page active">
    <div class="card">
      <div class="quarter-selector">
        <button class="quarter-btn active" onclick="loadQuarterly('1Q')">1Q</button>
        <button class="quarter-btn" onclick="loadQuarterly('2Q')">2Q</button>
        <button class="quarter-btn" onclick="loadQuarterly('3Q')">3Q</button>
        <button class="quarter-btn" onclick="loadQuarterly('4Q')">4Q</button>
      </div>
      <div class="report-header">
        <span class="tab-badge blue" id="q-badge">1Q</span>
        <h2 class="report-title" id="q-title">1Q予実</h2>
        <p class="report-comment" id="q-comment"></p>
      </div>
      <div style="padding: 0 24px 24px; overflow-x: auto;">
        <table class="report-table" id="q-table">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== 上半期予実 ===== -->
  <div id="page-half-year" class="page">
    <div class="card">
      <div class="report-header">
        <span class="tab-badge brown">上半期</span>
        <h2 class="report-title">18期上半期予実</h2>
        <div id="hy-comments"></div>
      </div>
      <div style="padding: 0 24px 24px; overflow-x: auto;">
        <table class="report-table" id="hy-table">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== 通期見通し ===== -->
  <div id="page-annual" class="page">
    <div class="card">
      <div class="report-header">
        <span class="tab-badge brown">通期</span>
        <h2 class="report-title">18期通期見通し</h2>
        <div id="an-comments"></div>
      </div>
      <div style="padding: 0 24px 24px; overflow-x: auto;">
        <table class="report-table" id="an-table">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== 通期見通しグラフ ===== -->
  <div id="page-chart" class="page">
    <div class="card">
      <div class="report-header">
        <span class="tab-badge brown">通期</span>
        <h2 class="report-title" id="chart-title">18期通期見通し</h2>
        <p class="report-subtitle" id="chart-subtitle"></p>
      </div>
      <div class="chart-container">
        <canvas id="forecastChart" class="chart-canvas"></canvas>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-line budget"></div>予算</div>
          <div class="legend-item"><div class="legend-line actual"></div>実績/見込み</div>
        </div>
      </div>
      <div style="padding: 0 24px 24px; overflow-x: auto;">
        <table class="report-table" id="chart-data-table">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== 管理会計 ===== -->
  <div id="page-mgmt" class="page">
    <div class="card">
      <div class="quarter-selector">
        <button class="quarter-btn" onclick="loadMgmt('1Q')">1Q</button>
        <button class="quarter-btn active" onclick="loadMgmt('2Q')">2Q</button>
      </div>
      <div class="report-header">
        <span class="tab-badge blue" id="mgmt-badge">2Q</span>
        <h2 class="report-title" id="mgmt-title">管理会計 2Q</h2>
        <p class="report-subtitle" id="mgmt-subtitle"></p>
      </div>

      <!-- 部門別営業利益 -->
      <div style="padding: 0 24px 16px;">
        <h3 style="margin: 16px 0 8px; font-size: 15px;">◆Q毎の営業利益</h3>
        <div style="overflow-x: auto;">
          <table class="report-table" id="mgmt-profit-table">
            <thead><tr></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- 人件費配分 -->
      <div style="padding: 0 24px 24px;">
        <h3 style="margin: 16px 0 8px; font-size: 15px;">◆Q毎の人件費配分</h3>
        <div style="overflow-x: auto;">
          <table class="report-table allocation-table" id="mgmt-alloc-table">
            <thead><tr></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- コメント -->
      <div id="mgmt-comments" style="padding: 0 24px 24px;"></div>
    </div>
  </div>

  <!-- ===== 財務諸表 ===== -->
  <div id="page-financial" class="page">
    <div class="fs-grid">
      <!-- P/L -->
      <div class="fs-card">
        <div class="fs-card-title">損益計算書（P/L）</div>
        <div class="fs-card-body" id="fs-pl"></div>
      </div>
      <!-- B/S -->
      <div class="fs-card">
        <div class="fs-card-title">貸借対照表（B/S）</div>
        <div class="fs-card-body" id="fs-bs"></div>
      </div>
      <!-- C/F -->
      <div class="fs-card">
        <div class="fs-card-title">キャッシュフロー計算書（C/F）</div>
        <div class="fs-card-body" id="fs-cf"></div>
      </div>
      <!-- 財務比率 -->
      <div class="fs-card">
        <div class="fs-card-title">財務比率分析</div>
        <div class="fs-card-body" id="fs-ratios"></div>
      </div>
    </div>
    <!-- 月次推移 -->
    <div class="card" style="margin-top: 24px;">
      <div class="report-header">
        <h2 class="report-title">月次推移</h2>
      </div>
      <div style="padding: 0 24px 24px; overflow-x: auto;">
        <table class="report-table trend-table" id="fs-trend">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="/js/app.js"></script>
</body>
</html>
